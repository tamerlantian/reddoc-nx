<!--
  Informe "Auxiliar de cuenta".
  Misma forma que el balance de prueba —comparte panel, botonera y tabla— con la
  columna del asiento encendida: bajo cada auxiliar del plan cuelga una fila por
  movimiento del rango. Sin botón de PDF: la familia de endpoints nueva no lo
  sirve.
-->
<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <app-movimiento-informe-params toolbar [form]="form" idPrefix="ac">
    <app-informe-cuentas-actions
      acciones
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="false"
      [hint]="hint()"
      (generar)="generar()"
      (excel)="exportExcel()"
    />
  </app-movimiento-informe-params>

  <!--
    `showMovimientoId` y no `showMovimiento`: este informe no trae comprobante,
    número ni fecha, así que el id del asiento es lo único que distingue una
    fila de detalle de otra.
  -->
  <app-movimiento-informe-table
    table
    [rows]="rows()"
    [empty]="empty"
    [totales]="totales()"
    [loading]="isLoading()"
    [generated]="generated()"
    [showMovimientoId]="true"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
  />
</lib-list-shell>
